<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f6fa"><title>ألبوم التسامح</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf8fb;color:#4c4057;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{text-align:center;padding:35px 16px 20px}h1{margin:0;color:#745d85;font-size:30px}p{color:#877a90}main{max-width:950px;margin:auto;padding:12px 18px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}figure{margin:0;background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 18px #4d335015}img{display:block;width:100%;height:auto;cursor:zoom-in}figcaption{text-align:center;padding:10px;color:#887889;font-size:13px}dialog{border:0;background:#161018;border-radius:12px;padding:14px;max-width:96vw;max-height:96vh}dialog img{width:auto;max-width:90vw;max-height:85vh;object-fit:contain;cursor:auto}button{border:0;background:#eee0ed;border-radius:9px;padding:10px 18px;cursor:pointer;margin-bottom:10px}#msg{display:none;text-align:center;padding:12px;color:#9c3851}</style></head><body><header><h1>ألبوم التسامح 🌷</h1><p>صور أعمال ومشاركات عن قيمة التسامح</p></header><main id="gallery"></main><p id="msg">إذا لم تظهر الصور، يرجى إعادة فتح المعرض لاحقًا.</p><dialog id="viewer"><button id="close">إغلاق ×</button><img id="large" alt="صورة من ألبوم التسامح"></dialog><script>const g=document.getElementById('gallery'),d=document.getElementById('viewer'),big=document.getElementById('large');let errors=0;for(let i=1;i<=11;i++){let n=String(i).padStart(2,'0'),f=document.createElement('figure'),im=document.createElement('img');im.src='photo-'+n+'.jpg';im.alt='الصورة '+i;im.loading='lazy';im.onerror=()=>{f.style.display='none';errors++;if(errors===11)document.getElementById('msg').style.display='block'};im.onclick=()=>{big.src=im.src;d.showModal()};let c=document.createElement('figcaption');c.textContent='الصورة '+i;f.append(im,c);g.append(f)}document.getElementById('close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()}</script></body></html>
